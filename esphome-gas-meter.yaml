---
substitutions:
  gpio_led: GPIO2
  # For gas one of: CCF, ft³, m³
  # For better accuracy avoid using large units like CCF.
  # You can always change the unit later in Home Assistant.
  volume_unit: 'ft³'
  # The most common value in US seems to be 0.125 ft³
  # If you modify the volume_unit, modify this too,
  # just search on Google: 0.125 ft³ to CCF (or whatever unit you selected)
  volume_per_half_rotation_initial_value: '0.125'
  calibration_minimal_axis_range_initial_value: '15'
  flow_update_interval_seconds: '30'
  magnetic_field_update_delta: '1'

packages:
  gas_meter: !include
    file: esphome-magnetometer.yaml
    vars:
      device_class: 'gas'
      device_icon: 'mdi:meter-gas'

switch:
  # LED flashes faster/slower as magnet rotates on water meter
  - platform: gpio
    id: led
    pin:
      number: ${gpio_led}
      inverted: true

number:
  - platform: template
    id: ${prefix_id}heating_value
    name: ${prefix_name}Heating Value
    entity_category: config
    mode: box
    min_value: 1
    max_value: 2000
    step: 0.0001
    initial_value: 11.493
    update_interval: never
    restore_value: true
    optimistic: true
    unit_of_measurement: kWh
    icon: mdi:fire

  - platform: template
    id: ${prefix_id}correction_factor
    name: ${prefix_name}Correction Factor
    entity_category: config
    mode: box
    min_value: 0
    max_value: 2
    step: 0.00001
    initial_value: 0.9514
    update_interval: never
    restore_value: true
    optimistic: true
    icon: mdi:multiplication

sensor:
  - platform: template
    id: ${prefix_id}sensor_total_kwh
    name: ${prefix_name}Total kWh
    lambda: return id(${prefix_id}sensor_total).state * id(${prefix_id}heating_value).state * id(${prefix_id}correction_factor).state;
    update_interval: 10s
    accuracy_decimals: 3
    device_class: energy
    icon: mdi:gas-burner
    state_class: total_increasing
    unit_of_measurement: 'kWh'
    filters:
      - or:
          - throttle: 60s
          - delta: 0
